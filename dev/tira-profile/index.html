<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIRA! — Player Profile</title>
<style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#061421;color:#eaf7ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:clamp(14px,4vw,30px);background:radial-gradient(circle at 50% 0%,#19425b,#071827 65%,#04101d)}main{width:min(100%,540px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{font-size:30px;letter-spacing:.07em;font-weight:900;color:#91e8ff}.back{color:#b9d8e8;text-decoration:none;font-size:14px}.identity{display:flex;align-items:center;gap:18px;padding:22px;border:1px solid #345c73;border-radius:22px;background:#102c40}.avatar{width:82px;height:82px;display:grid;place-items:center;flex:none;font-size:43px;border-radius:23px;background:#19445e}.identity h1{margin:0 0 5px;font-size:clamp(23px,6vw,31px);overflow-wrap:anywhere}.muted{color:#9ebfd1;font-size:13px;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 20px}.stat{background:#10293c;border:1px solid #294c63;border-radius:15px;padding:15px 8px;text-align:center}.stat strong{display:block;font-size:23px}.stat span{font-size:12px;color:#a5c8d9}.section{background:#10293c;border:1px solid #294d63;border-radius:18px;margin:12px 0;overflow:hidden}.section summary{padding:17px 19px;font-size:16px;font-weight:750;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}.section summary:after{content:'⌄';color:#a2d9f2}.section[open] summary:after{content:'⌃'}.section .content{padding:0 19px 19px}.section p{color:#a9c7d9;font-size:13px;line-height:1.5}.field{display:block;margin:10px 0 6px;color:#c5dfed;font-size:13px}input[type=text]{width:100%;border:1px solid #537f99;border-radius:11px;background:#071d2d;color:#fff;padding:13px;font:inherit}.avatars{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 17px}button{font:700 14px system-ui;color:#eaf7ff;background:#1a4862;border:1px solid #4e819e;border-radius:12px;padding:12px;cursor:pointer}button[aria-pressed=true]{border-color:#b2f2ff;background:#28617e;box-shadow:0 0 0 2px #62c7f944}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #a4e9ff;outline-offset:3px}.primary{background:#1779a5;border-color:#70cbed}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid #294a60}.setting-row label{font-size:13px}.setting-row input[type=range]{width:45%;accent-color:#7dd9ff}.setting-row input[type=checkbox]{width:19px;height:19px;accent-color:#66c8ed}.note{font-size:12px;color:#a8c8d8}.status{min-height:20px;color:#a6f0ca;font-size:13px}.notice{color:#ffdca4}.bottom{margin:20px 0;text-align:center}.bottom a{color:#a5d8f2;font-size:13px;text-decoration:none}</style></head>
<body><main><header class="top"><span class="brand">TIRA!</span><a class="back" href="../">← Home</a></header><div id="profileDetails" aria-live="polite"></div><div class="stats"><div class="stat"><strong id="wins">0</strong><span>Wins</span></div><div class="stat"><strong id="losses">0</strong><span>Losses</span></div><div class="stat"><strong>—</strong><span>Rank</span></div></div><details class="section" id="editProfile"><summary>Edit profile</summary><div class="content"><label class="field" for="editName">Display name</label><input type="text" id="editName" maxlength="24"><label class="field">Avatar</label><div id="editAvatars" class="avatars" role="group" aria-label="Choose avatar"></div><button class="primary" id="saveProfile">Save changes</button><p id="editError" class="status" role="status"></p></div></details><details class="section"><summary>Settings &amp; Sound</summary><div class="content"><div class="setting-row"><label for="coreVolume">Core volume</label><input type="range" id="coreVolume" min="0" max="100" step="5"></div><div class="setting-row"><label for="musicEnabled">Background music</label><input type="checkbox" id="musicEnabled"></div><div class="setting-row"><label for="musicVolume">Music volume</label><input type="range" id="musicVolume" min="0" max="100" step="5"></div><div class="setting-row"><label for="introEnabled">Animated intro</label><input type="checkbox" id="introEnabled"></div><div class="setting-row"><label for="flickerEnabled">Flicker sound</label><input type="checkbox" id="flickerEnabled"></div><p class="note">Settings are saved in this browser.</p><p id="settingsStatus" class="status" role="status"></p></div></details><details class="section"><summary>Rank</summary><div class="content"><p>Unranked · Ranked play is coming later.</p></div></details><p class="bottom"><a href="../">Back to game home</a></p></main>
<script src="../profile-layer1.js"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),avatars={orb:'🔵',spark:'✨',shield:'🛡️',star:'⭐'};let selected=null;
function render(){const p=window.TiraLocalProfile?.get();if(!p){$('profileDetails').textContent='Create your guest profile on the home page first.';return}const r=window.TiraLocalProfile.record();$('profileDetails').replaceChildren();const card=document.createElement('div');card.className='identity';const pic=document.createElement('div');pic.className='avatar';pic.textContent=avatars[p.avatarId]||'🔵';const info=document.createElement('div');const name=document.createElement('h1');name.textContent=p.displayName;const sub=document.createElement('p');sub.className='muted';sub.textContent='Guest player';info.append(name,sub);card.append(pic,info);$('profileDetails').append(card);$('wins').textContent=r.wins;$('losses').textContent=r.losses;$('editName').value=p.displayName;selected=p.avatarId;drawAvatars()}
function drawAvatars(){const holder=$('editAvatars');holder.replaceChildren();for(const [key,emoji] of Object.entries(avatars)){const b=document.createElement('button');b.type='button';b.textContent=emoji;b.setAttribute('aria-label',key);b.setAttribute('aria-pressed',String(selected===key));b.onclick=()=>{selected=key;drawAvatars()};holder.append(b)}}
$('saveProfile').onclick=()=>{const result=window.TiraLocalProfile?.update({displayName:$('editName').value,avatarId:selected});$('editError').textContent=result?.ok?'Profile saved.':(result?.error||'Unable to save.');if(result?.ok)render()};
const mixKey='tira-dev-audio-mix-v3';let mix={};try{mix=JSON.parse(localStorage.getItem(mixKey)||'{}')}catch{}const sharedKey='tira-dev-shared-music-enabled-v1';const get=(k,f)=>{try{return localStorage.getItem(k)??f}catch{return f}},put=(k,v)=>{try{localStorage.setItem(k,v)}catch{$('settingsStatus').textContent='Could not save settings.'}};
$('coreVolume').value=get('corbit-dev-core-volume-spring-v1','45');$('musicEnabled').checked=get(sharedKey,mix.music===false?'off':'on')==='on';$('musicVolume').value=Number.isFinite(Number(mix.musicVolume))?Number(mix.musicVolume):50;$('introEnabled').checked=get('tira-dev-intro-v1','on')==='on';$('flickerEnabled').checked=mix.flicker!==false;
$('coreVolume').oninput=()=>put('corbit-dev-core-volume-spring-v1',$('coreVolume').value);$('introEnabled').onchange=()=>put('tira-dev-intro-v1',$('introEnabled').checked?'on':'off');
function saveMix(){mix.music=$('musicEnabled').checked;mix.musicVolume=Number($('musicVolume').value);mix.flicker=$('flickerEnabled').checked;put(mixKey,JSON.stringify(mix));put(sharedKey,mix.music?'on':'off');$('settingsStatus').textContent='Saved. Music changes apply when you return home.'}
$('musicEnabled').onchange=saveMix;$('musicVolume').oninput=saveMix;$('flickerEnabled').onchange=saveMix;
window.addEventListener('tira-local-profile-ready',render);window.addEventListener('pageshow',render);render();
})();
</script></body></html>
